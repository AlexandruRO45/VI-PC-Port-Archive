name: Release Desktop GUI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.1)"
        required: true
        default: "v1.2.1"
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            artifact: release-windows
          - os: ubuntu-24.04
            label: linux-x64
            artifact: release-linux
          - os: macos-latest
            label: macos-arm64
            artifact: release-macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0 libfontconfig1

      - name: Install GUI and PyInstaller dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r gui/requirements-build.txt

      - name: Run unit and validation checks
        shell: bash
        run: |
          python -I tools/validate.py code
          python -I tests/test_validate.py
          python -I tests/test_gui_core.py
          python -I tests/test_text_write_line_endings.py

      - name: Build Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name Leonida-windows-x64 `
            --icon "assets/logo.png" `
            --add-data "assets/fonts;assets/fonts" `
            --add-data "assets/logo.png;assets" `
            --add-data "game/xbox-1.0.2.1.json;game" `
            --add-data "make_game.py;." `
            --add-data "tools;tools" `
            --add-data "gui;gui" `
            --add-data "scripts;scripts" `
            --add-data "runtime;runtime" `
            --add-data "third_party;third_party" `
            --add-data "viewer;viewer" `
            leonida_gui.py
          New-Item -ItemType Directory -Force -Path release-out | Out-Null
          Copy-Item dist/Leonida-windows-x64.exe release-out/Leonida-windows-x64.exe
          $p = Start-Process -FilePath "release-out/Leonida-windows-x64.exe" -ArgumentList "--self-check" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            throw "Windows executable self-check failed with exit code $($p.ExitCode)"
          }

      - name: Build Linux package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --onedir \
            --name Leonida \
            --add-data "assets/fonts:assets/fonts" \
            --add-data "assets/logo.png:assets" \
            --add-data "game/xbox-1.0.2.1.json:game" \
            --add-data "make_game.py:." \
            --add-data "tools:tools" \
            --add-data "gui:gui" \
            --add-data "scripts:scripts" \
            --add-data "runtime:runtime" \
            --add-data "third_party:third_party" \
            --add-data "viewer:viewer" \
            leonida_gui.py
          ./dist/Leonida/Leonida --version
          ./dist/Leonida/Leonida --self-check
          mkdir -p release-out
          tar -czf release-out/Leonida-linux-x64.tar.gz -C dist Leonida

      - name: Build macOS app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed \
            --name Leonida \
            --icon "assets/logo.png" \
            --add-data "assets/fonts:assets/fonts" \
            --add-data "assets/logo.png:assets" \
            --add-data "game/xbox-1.0.2.1.json:game" \
            --add-data "make_game.py:." \
            --add-data "tools:tools" \
            --add-data "gui:gui" \
            --add-data "scripts:scripts" \
            --add-data "runtime:runtime" \
            --add-data "third_party:third_party" \
            --add-data "viewer:viewer" \
            leonida_gui.py
          ./dist/Leonida.app/Contents/MacOS/Leonida --version
          ./dist/Leonida.app/Contents/MacOS/Leonida --self-check
          mkdir -p release-out
          (cd dist && ditto -c -k --sequesterRsrc --keepParent Leonida.app ../release-out/Leonida-macos-arm64.zip)

      - name: Upload platform artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: release-out/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$REF_NAME"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          fi
          cd release-assets
          sha256sum Leonida-windows-x64.exe Leonida-linux-x64.tar.gz Leonida-macos-arm64.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

          NOTES=$(cat <<EOF
          ## Leonida Desktop GUI ($TAG)

          Native multiplatform desktop interface for Leonida using the **Outfit** typeface, with integrated environment, codebase, and SHA-256 game-package validation.

          ### Downloads
          - **Windows (x64)**: \`Leonida-windows-x64.exe\`
          - **Linux (x64)**: \`Leonida-linux-x64.tar.gz\`
          - **macOS (Apple Silicon)**: \`Leonida-macos-arm64.zip\`
          - **Checksums**: \`SHA256SUMS.txt\`

          > Contains no game files, keys, or proprietary executables. Everything is built locally from your own copy.
          EOF
          )

          BASE_TAG="$TAG"
          N=2
          while gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; do
            TAG="${BASE_TAG}-r${N}"
            N=$((N + 1))
          done

          gh release create "$TAG" \
            Leonida-windows-x64.exe \
            Leonida-linux-x64.tar.gz \
            Leonida-macos-arm64.zip \
            SHA256SUMS.txt \
            --title "Leonida $TAG" \
            --notes "$NOTES" \
            --repo "${GITHUB_REPOSITORY}"
