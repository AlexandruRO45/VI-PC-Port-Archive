# Counts the graphics path (the D3D12 -> Vulkan layer and the RDNA2 -> SPIR-V translator) from the committed code and
# publishes the page. The outputs are regenerated, never committed. See docs/graphics_progress.md.
name: Graphics progress

on:
  push:
    branches: [main]
    paths:
      - "runtime/**"
      - "tools/rdna2spirv.py"
      - "tools/isa_coverage.py"
      - "tools/gen_d3d12_stubs.py"
      - "tools/gfx10_formats.json"
      - "tools/graphics_progress.py"
      - "tools/graphics_progress_data.json"
      - "docs/d3d12_vulkan.md"
      - "docs/isa_coverage.md"
      - ".github/workflows/graphics-progress.yml"
  pull_request:
    paths:
      - "tools/graphics_progress.py"
      - "tools/graphics_progress_data.json"
      - "tests/test_graphics_progress.py"
      - ".github/workflows/graphics-progress.yml"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: graphics-progress-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    outputs:
      pages: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Test the counters
        run: python -I tests/test_graphics_progress.py
      # The history file is the only state: one point per date, carried between runs through the cache.
      - name: Restore the history
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site/graphics-history.json
          key: graphics-history-restore-only
          restore-keys: graphics-history-
      - name: Count the graphics path
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          mkdir -p site
          if [ "$EVENT_NAME" = "pull_request" ]; then
            python -I tools/graphics_progress.py --tree HEAD --out-dir site --print
          else
            python -I tools/graphics_progress.py --tree HEAD --out-dir site --date "$(date -u +%F)" --print
          fi
          cp site/graphics.html site/index.html
      - name: Save the history
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site/graphics-history.json
          key: graphics-history-${{ github.run_id }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: graphics-progress
          path: site/
          if-no-files-found: error
      # Pages may not be enabled (forks, this repository today). Asking is allowed to fail; the answer is the guard.
      - name: Is GitHub Pages enabled?
        id: pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is not enabled for this repository; the page is only in the artifact."
          fi

  deploy:
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: graphics-progress-pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: graphics-progress
          path: site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
