# Keeps the archive in step with the projects still on GitHub: code, pull requests, issues and the site data.
# Pushes use the workflow's own token, so they never start the archived projects' own workflows in this repo.
name: Sync projects

on:
  # GitHub's hourly timer has not been starting this workflow, so each run also queues the next one (last step).
  # The timer stays as a backup: if the chain ever breaks, the next timer run starts it again.
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write  # to queue the next run

# one run at a time; a run waiting behind it replaces any older waiting run
concurrency:
  group: sync

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v5

      - name: Sync
        timeout-minutes: 50
        env:
          GH_TOKEN: ${{ github.token }}
          # give up on a fetch or push that moves less than 1 KB/s for a minute instead of hanging
          GIT_HTTP_LOW_SPEED_LIMIT: "1000"
          GIT_HTTP_LOW_SPEED_TIME: "60"
        run: |
          # commit as the repo owner so no bot shows up as a contributor
          git config user.name Guernica4u
          git config user.email 261697299+Guernica4u@users.noreply.github.com
          status=0
          python3 -I .github/sync.py --push || status=$?
          git add -A
          if ! git diff --cached --quiet; then
            git commit -q -m "Sync with the projects on GitHub ($(date -u '+%Y-%m-%d %H:%M') UTC)"
            # main may have moved while the sync ran; replay this commit on top
            git pull -q --rebase origin main
            git push origin HEAD:main
          fi
          exit $status

      - name: Queue the next run
        if: always()
        timeout-minutes: 75
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # wait until 7 minutes past the next hour, then start the next run unless one is already waiting
          now=$(date +%s); next=$(( (now / 3600 + 1) * 3600 + 420 ))
          echo "next run at $(date -u -d @$next '+%H:%M') UTC"
          sleep $(( next - now ))
          waiting=$(gh run list --workflow sync.yml --json status --jq '[.[] | select(.status == "queued" or .status == "pending" or .status == "waiting")] | length')
          if [ "$waiting" = "0" ]; then gh workflow run sync.yml --ref main; else echo "a run is already waiting"; fi
