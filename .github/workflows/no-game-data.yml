name: No Game Data
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # Coalesce superseded pending pushes per branch without canceling an active main build.
  group: no-game-data-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  no-game-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: No game data tracked
        run: |
          # .code and .state: the native programs tools/fspx_unpack.py carves out of the package, raw machine code with
          # no magic for the next step to read. .xvc: a package container, as make_game.py's CONTAINER_SUFFIXES has
          # it. .lpk: world_build.py's packs of the game's geometry. .smh: the package's groom files (smh_groom.py).
          bad=$(git ls-files -z | grep -ziE '\.(rpf|ttpf|xvd|msixvc|xvc|dxbc|fssm|spv|spvasm|code|state|dds|bk2|awc|r9modeldata|obj|glb|lpk|smh|ogg|wav|exe|dll)$' | tr '\0' '\n' || true)
          if [ -n "$bad" ]; then
            echo "Game or binary files tracked:"
            echo "$bad"
            exit 1
          fi
      - name: No game data under another name
        run: python3 -I scripts/check_no_game_data.py
