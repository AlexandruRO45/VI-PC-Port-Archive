name: No Game Data
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # Coalesce superseded pending pushes per branch without canceling an active main build.
  group: no-game-data-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  no-game-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: No game data tracked
        run: |
          ext='\.(rpf|ttpf|xvd|msixvc|dxbc|fssm|spv|spvasm|dds|bk2|awc|r9modeldata|obj|glb|ogg|wav|exe|dll)$'
          # A shader disassembly listing keeps its shader's name: 16 or more hex digits, then the extension or a
          # suffix after '.', '~' (tools/shader_carve.py) or '_' (tools/fspx_unpack.py). Hand-written fixtures
          # have readable names.
          listing='(^|/)[0-9a-f]{16,}([._~][^/]*)?\.(s|asm)$'
          bad=$(git ls-files -z | grep -ziE "$ext|$listing" | tr '\0' '\n' || true)
          if [ -n "$bad" ]; then
            echo "Game or binary files or shader listings tracked:"
            echo "$bad"
            exit 1
          fi
      - name: No game data under another name
        run: python3 -I scripts/check_no_game_data.py
