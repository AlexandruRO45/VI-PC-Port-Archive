name: Opus packet decoder

on:
  push:
    branches: [main]
    paths:
      - "runtime/opus_decoder/**"
      - "tools/awc_opus.py"
      - ".github/workflows/opus-decoder.yml"
  pull_request:
    paths:
      - "runtime/opus_decoder/**"
      - "tools/awc_opus.py"
      - ".github/workflows/opus-decoder.yml"

permissions:
  contents: read

jobs:
  compare-pcm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and test the native library
        working-directory: runtime/opus_decoder
        run: |
          cargo fmt -- --check
          cargo test --locked
          cargo build --locked
      - name: Compare generated packets with the FFmpeg decoder
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          python3 -I runtime/opus_decoder/tests/compare_ffmpeg.py runtime/opus_decoder/target/debug/libleonida_opus_decoder.so
