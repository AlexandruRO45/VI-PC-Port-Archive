name: Coverage dashboard

# Publishes the README graphic drawn by the Windows checks on main. This job runs no repository code:
# it copies one SVG artifact to the coverage-dashboard branch, which holds only that file.
on:
  workflow_run:
    workflows: [Windows checks]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: coverage-dashboard
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the coverage dashboard
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage-dashboard
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: dashboard
      - name: Replace the dashboard on the coverage-dashboard branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # A run for an older commit that finishes late must not replace a newer dashboard.
          if [ "$(gh api "repos/$REPO/commits/main" --jq .sha)" != "$SHA" ]; then
            echo "main moved past $SHA; skipping"
            exit 0
          fi
          git init -q site
          cp dashboard/dashboard.svg site/
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.svg
          git commit -q -m "Coverage dashboard for $SHA"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:refs/heads/coverage-dashboard
