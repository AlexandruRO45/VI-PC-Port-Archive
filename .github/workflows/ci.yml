name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        shell: pwsh
        run: |
          $out = & cargo clippy --workspace --all-targets --locked --message-format=json -- -D warnings 2>&1
          $code = $LASTEXITCODE
          $seen = [System.Collections.Generic.HashSet[string]]::new()
          $msgs = [System.Collections.Generic.List[string]]::new()
          foreach ($line in $out) {
            try {
              $obj = $line | ConvertFrom-Json -ErrorAction Stop
              if ($obj.reason -eq 'compiler-message' -and ($obj.message.level -eq 'error' -or $obj.message.level -eq 'warning')) {
                $r = $obj.message.rendered
                if ($r -and $seen.Add($r)) { $msgs.Add($r) }
              }
            } catch {}
          }
          $buf = ""
          $n = 0
          foreach ($m in $msgs) {
            if (($buf.Length + $m.Length) -gt 3200 -and $buf.Length -gt 0) {
              $enc = ($buf -replace '%','%25' -replace "`r",'' -replace "`n",'%0A')
              Write-Output "::error file=Cargo.toml,line=1::$enc"
              $buf = ""
              $n++
              if ($n -ge 9) { break }
            }
            $buf += $m + "`n"
          }
          if ($buf.Length -gt 0) {
            $enc = ($buf -replace '%','%25' -replace "`r",'' -replace "`n",'%0A')
            Write-Output "::error file=Cargo.toml,line=1::$enc"
          }
          exit $code
      - name: Clippy, diagnostics build
        shell: pwsh
        run: |
          $out = & cargo clippy --workspace --all-targets --all-features --locked --message-format=json -- -D warnings 2>&1
          $code = $LASTEXITCODE
          $seen = [System.Collections.Generic.HashSet[string]]::new()
          $msgs = [System.Collections.Generic.List[string]]::new()
          foreach ($line in $out) {
            try {
              $obj = $line | ConvertFrom-Json -ErrorAction Stop
              if ($obj.reason -eq 'compiler-message' -and ($obj.message.level -eq 'error' -or $obj.message.level -eq 'warning')) {
                $r = $obj.message.rendered
                if ($r -and $seen.Add($r)) { $msgs.Add($r) }
              }
            } catch {}
          }
          $buf = ""
          $n = 0
          foreach ($m in $msgs) {
            if (($buf.Length + $m.Length) -gt 3200 -and $buf.Length -gt 0) {
              $enc = ($buf -replace '%','%25' -replace "`r",'' -replace "`n",'%0A')
              Write-Output "::error file=Cargo.toml,line=1::$enc"
              $buf = ""
              $n++
              if ($n -ge 9) { break }
            }
            $buf += $m + "`n"
          }
          if ($buf.Length -gt 0) {
            $enc = ($buf -replace '%','%25' -replace "`r",'' -replace "`n",'%0A')
            Write-Output "::error file=Cargo.toml,line=1::$enc"
          }
          exit $code
      # Includes xtask's repository_passes_policy, the asset-policy check.
      - name: Tests
        shell: pwsh
        run: |
          $pkgs = @('victory-core','victory-formats','victory-game','victory-gpu','victory-hle','victory-loader','victory-pe','victory-pipeline','victory-shader','victory','xtask')
          $overall = 0
          $buf = ""
          $n = 0
          foreach ($p in $pkgs) {
            $tmp = [System.IO.Path]::GetTempFileName()
            $err = [System.IO.Path]::GetTempFileName()
            $proc = Start-Process -FilePath cargo -ArgumentList @('test','-p',$p,'--locked','--','--test-threads=1','--nocapture') -NoNewWindow -PassThru -RedirectStandardOutput $tmp -RedirectStandardError $err
            $done = $proc.WaitForExit(120000)
            if (-not $done) {
              try { $proc.Kill($true) } catch {}
              $code = 124
            } else {
              $code = $proc.ExitCode
            }
            $so = Get-Content -Path $tmp -ErrorAction SilentlyContinue
            $se = Get-Content -Path $err -ErrorAction SilentlyContinue
            Remove-Item $tmp,$err -Force -ErrorAction SilentlyContinue
            $all = @($so) + @($se)
            if ($code -ne 0) {
              $overall = 1
              $tail = ($all | Select-Object -Last 25) -join "`n"
              $block = "=== PKG $p FAILED (exit=$code) ===`n$tail`n"
              if (($buf.Length + $block.Length) -gt 3200 -and $buf.Length -gt 0) {
                $enc = ($buf -replace '%','%25' -replace "`r",'' -replace "`n",'%0A')
                Write-Output "::error file=Cargo.toml,line=1::$enc"
                $buf = ""
                $n++
                if ($n -ge 9) { break }
              }
              $buf += $block
            }
          }
          if ($buf.Length -gt 0) {
            $enc = ($buf -replace '%','%25' -replace "`r",'' -replace "`n",'%0A')
            Write-Output "::error file=Cargo.toml,line=1::$enc"
          }
          exit $overall
