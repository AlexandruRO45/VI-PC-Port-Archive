name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy, diagnostics build
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Includes xtask's repository_passes_policy, the asset-policy check.
      - name: Tests
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set +e
          set -o pipefail
          cargo test --workspace --locked 2>&1 | tee /tmp/test.log
          rc=$?
          if [ "$rc" -ne 0 ]; then
            awk '/^failures:/{flag=1} flag && NF{print "::error::" $0}' /tmp/test.log | head -n 10
            exit "$rc"
          fi
