name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        shell: pwsh
        run: |
          $out = & cargo clippy --workspace --all-targets --locked --message-format=json -- -D warnings 2>&1
          $code = $LASTEXITCODE
          $seen = [System.Collections.Generic.HashSet[string]]::new()
          $msgs = [System.Collections.Generic.List[string]]::new()
          foreach ($line in $out) {
            try {
              $obj = $line | ConvertFrom-Json -ErrorAction Stop
              if ($obj.reason -eq 'compiler-message' -and ($obj.message.level -eq 'error' -or $obj.message.level -eq 'warning')) {
                $r = $obj.message.rendered
                if ($r -and $seen.Add($r)) { $msgs.Add($r) }
              }
            } catch {}
          }
          $buf = ""
          $n = 0
          foreach ($m in $msgs) {
            if (($buf.Length + $m.Length) -gt 3200 -and $buf.Length -gt 0) {
              $enc = ($buf -replace '%','%25' -replace "`r",'' -replace "`n",'%0A')
              Write-Output "::error file=Cargo.toml,line=1::$enc"
              $buf = ""
              $n++
              if ($n -ge 9) { break }
            }
            $buf += $m + "`n"
          }
          if ($buf.Length -gt 0) {
            $enc = ($buf -replace '%','%25' -replace "`r",'' -replace "`n",'%0A')
            Write-Output "::error file=Cargo.toml,line=1::$enc"
          }
          exit $code
      - name: Clippy, diagnostics build
        shell: pwsh
        run: |
          $out = & cargo clippy --workspace --all-targets --all-features --locked --message-format=json -- -D warnings 2>&1
          $code = $LASTEXITCODE
          $seen = [System.Collections.Generic.HashSet[string]]::new()
          $msgs = [System.Collections.Generic.List[string]]::new()
          foreach ($line in $out) {
            try {
              $obj = $line | ConvertFrom-Json -ErrorAction Stop
              if ($obj.reason -eq 'compiler-message' -and ($obj.message.level -eq 'error' -or $obj.message.level -eq 'warning')) {
                $r = $obj.message.rendered
                if ($r -and $seen.Add($r)) { $msgs.Add($r) }
              }
            } catch {}
          }
          $buf = ""
          $n = 0
          foreach ($m in $msgs) {
            if (($buf.Length + $m.Length) -gt 3200 -and $buf.Length -gt 0) {
              $enc = ($buf -replace '%','%25' -replace "`r",'' -replace "`n",'%0A')
              Write-Output "::error file=Cargo.toml,line=1::$enc"
              $buf = ""
              $n++
              if ($n -ge 9) { break }
            }
            $buf += $m + "`n"
          }
          if ($buf.Length -gt 0) {
            $enc = ($buf -replace '%','%25' -replace "`r",'' -replace "`n",'%0A')
            Write-Output "::error file=Cargo.toml,line=1::$enc"
          }
          exit $code
      # Includes xtask's repository_passes_policy, the asset-policy check.
      - name: Tests
        shell: pwsh
        run: |
          $out = & cargo test --workspace --locked --no-fail-fast -- --test-threads=1 --nocapture 2>&1
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Output $_ }
          if ($code -ne 0) {
            $lines = @($out | ForEach-Object { "$_" })
            $buf = ""
            $n = 0
            for ($idx = 0; $idx -lt $lines.Count; $idx++) {
              if ($lines[$idx] -match 'FAILED|panicked at|error: test failed|process didn''t exit|test result: .*[1-9] failed') {
                $lo = [Math]::Max(0, $idx - 8)
                $hi = [Math]::Min($lines.Count - 1, $idx + 6)
                $block = ($lines[$lo..$hi] -join "`n") + "`n---`n"
                if (($buf.Length + $block.Length) -gt 3200 -and $buf.Length -gt 0) {
                  $enc = ($buf -replace '%','%25' -replace "`r",'' -replace "`n",'%0A')
                  Write-Output "::error file=Cargo.toml,line=1::$enc"
                  $buf = ""
                  $n++
                  if ($n -ge 9) { break }
                }
                $buf += $block
              }
            }
            if ($buf.Length -gt 0) {
              $enc = ($buf -replace '%','%25' -replace "`r",'' -replace "`n",'%0A')
              Write-Output "::error file=Cargo.toml,line=1::$enc"
            }
          }
          exit $code
