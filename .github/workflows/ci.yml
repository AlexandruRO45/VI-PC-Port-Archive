name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy, diagnostics build
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Includes xtask's repository_passes_policy, the asset-policy check.
      - name: Tests
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set +e
          echo "::error::git_ver=$(git --version)"
          echo "::error::pwd=$(pwd)"
          echo "::error::check_ignore=$(git check-ignore -v target/CACHEDIR.TAG 2>&1 || true)"
          echo "::error::gitignore_head=$(head -n 15 .gitignore | tr '\n' '|')"
          echo "::error::ls_target=$(ls -ld target target/CACHEDIR.TAG 2>&1 || true)"
          echo "::error::git_ls=$(git ls-files --others --exclude-standard | head -n 5 | tr '\n' '|')"
          echo "::error::git_status=$(git status --short | head -n 5 | tr '\n' '|')"
          cargo test -p xtask --locked
          exit 1
