name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        shell: pwsh
        run: |
          $out = & cargo clippy --workspace --all-targets --locked --message-format=json -- -D warnings 2>&1
          $code = $LASTEXITCODE
          foreach ($line in $out) {
            try {
              $obj = $line | ConvertFrom-Json -ErrorAction Stop
              if ($obj.reason -eq 'compiler-message' -and ($obj.message.level -eq 'error' -or $obj.message.level -eq 'warning')) {
                $span = $obj.message.spans | Where-Object { $_.is_primary } | Select-Object -First 1
                $file = if ($span) { $span.file_name } else { 'Cargo.toml' }
                $ln = if ($span) { $span.line_start } else { 1 }
                $msg = ($obj.message.rendered -replace '%','%25' -replace "`r",'' -replace "`n",'%0A')
                Write-Output "::error file=$file,line=$ln::$msg"
              }
            } catch {
              Write-Output $line
            }
          }
          exit $code
      - name: Clippy, diagnostics build
        shell: pwsh
        run: |
          $out = & cargo clippy --workspace --all-targets --all-features --locked --message-format=json -- -D warnings 2>&1
          $code = $LASTEXITCODE
          foreach ($line in $out) {
            try {
              $obj = $line | ConvertFrom-Json -ErrorAction Stop
              if ($obj.reason -eq 'compiler-message' -and ($obj.message.level -eq 'error' -or $obj.message.level -eq 'warning')) {
                $span = $obj.message.spans | Where-Object { $_.is_primary } | Select-Object -First 1
                $file = if ($span) { $span.file_name } else { 'Cargo.toml' }
                $ln = if ($span) { $span.line_start } else { 1 }
                $msg = ($obj.message.rendered -replace '%','%25' -replace "`r",'' -replace "`n",'%0A')
                Write-Output "::error file=$file,line=$ln::$msg"
              }
            } catch {
              Write-Output $line
            }
          }
          exit $code
      # Includes xtask's repository_passes_policy, the asset-policy check.
      - name: Tests
        shell: pwsh
        run: |
          $out = & cargo test --workspace --locked 2>&1
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Output $_ }
          if ($code -ne 0) {
            $fail = ($out | Select-String -Pattern 'FAILED|panicked at|error\[' -Context 0,4 | Out-String)
            $msg = ($fail.Substring(0, [Math]::Min($fail.Length, 3500)) -replace '%','%25' -replace "`r",'' -replace "`n",'%0A')
            Write-Output "::error file=Cargo.toml,line=1::$msg"
          }
          exit $code
