name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        shell: bash
        run: |
          set +e
          CARGO_TERM_COLOR=never cargo clippy --workspace --all-targets --locked --message-format=short -- -D warnings > /tmp/clippy.log 2>&1
          code=$?
          cat /tmp/clippy.log
          if [ $code -ne 0 ]; then
            grep -E '(error|warning)' /tmp/clippy.log | head -n 40 | while IFS= read -r line; do echo "::error::$line"; done
            exit $code
          fi
      - name: Clippy, diagnostics build
        shell: bash
        run: |
          set +e
          CARGO_TERM_COLOR=never cargo clippy --workspace --all-targets --all-features --locked --message-format=short -- -D warnings > /tmp/clippy_diag.log 2>&1
          code=$?
          cat /tmp/clippy_diag.log
          if [ $code -ne 0 ]; then
            grep -E '(error|warning)' /tmp/clippy_diag.log | head -n 40 | while IFS= read -r line; do echo "::error::$line"; done
            exit $code
          fi
      # Includes xtask's repository_passes_policy, the asset-policy check.
      - name: Tests
        shell: bash
        run: |
          set +e
          CARGO_TERM_COLOR=never cargo test --workspace --locked > /tmp/test.log 2>&1
          code=$?
          cat /tmp/test.log
          if [ $code -ne 0 ]; then
            grep -E '(FAILED|panicked|assertion|left:|right:|error\[|process didn|dxil\.dll|must lower|expected|rejected)' /tmp/test.log | head -n 10 | while IFS= read -r line; do echo "::error::$line"; done
            exit $code
          fi
