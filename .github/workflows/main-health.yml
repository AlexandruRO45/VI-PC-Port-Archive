name: main health

# Push runs on main are cancelled by the next merge almost every time, so nothing reports a red main. Once an hour
# this runs the CPU suites on main (Python 3.12, as ci.yml) and keeps one issue up to date: opened or updated with the
# failing files while main is red, closed when it is green again.
on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: main-health
  cancel-in-progress: false

env:
  PYTEST_FILE_MARKERS: '^import pytest|^ *HAVE_NUMPY ='
  ISSUE_TITLE: "main is red (scheduled check)"

jobs:
  main-health:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install SPIRV-Tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends spirv-tools
      - name: Run the CPU suites
        shell: bash
        env:
          LEONIDA_REQUIRE_SPIRV_TOOLS: "1"
        run: |
          : > failed.txt
          if ! python -I scripts/run_semantic_tests.py tests/semantic > semantic.log 2>&1; then
            echo "tests/semantic: $(tail -n 1 semantic.log)" >> failed.txt
          fi
          tail -n 1 semantic.log
          while IFS= read -r t; do
            if grep -Eq "$PYTEST_FILE_MARKERS" "$t" || ! grep -q '__main__' "$t"; then
              continue
            fi
            python -I "$t" > /dev/null 2>&1 || echo "$t" >> failed.txt
          done < <(find tests -path 'tests/semantic' -prune -o -type f -name 'test_*.py' -print | LC_ALL=C sort)
          cat failed.txt
      - name: Open, update or close the issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          sha=$(git rev-parse --short HEAD)
          issue=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number,title \
            --jq "map(select(.title == \"$ISSUE_TITLE\"))[0].number // empty")
          if [ -s failed.txt ]; then
            {
              echo "The scheduled check found failing tests on \`main\` at \`$sha\` (Python 3.12, Linux): [run]($RUN_URL)."
              echo
              sed 's/^/- /' failed.txt
              echo
              echo "This issue is updated every hour while \`main\` is red and closed when it is green again."
            } > body.md
            if [ -n "$issue" ]; then
              gh issue edit "$issue" --body-file body.md
            else
              gh issue create --title "$ISSUE_TITLE" --body-file body.md
            fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --comment "Green again at \`$sha\`: [run]($RUN_URL)."
          fi
