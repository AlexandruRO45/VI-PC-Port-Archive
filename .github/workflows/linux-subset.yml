# Interim Linux CI for the crates that already build without Windows.
# Superseded once full-workspace Linux CI lands; fold or delete then.
#
# Every step here passes on plain Linux with no Windows SDK, no cross target
# and no game data. The PR that added this lists the same commands for local use.
name: linux-subset

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned to full commit SHAs (tag in the trailing comment): a tag
# can be moved to other code, a commit cannot. Bump both together.

# A newer push to a PR cancels its older run. Runs on main are never
# cancelled: only main saves the rust-cache, so a cancelled main run would
# leave PRs restoring a stale cache.
concurrency:
  group: linux-subset-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # A failing test or build script prints where it panicked.
  RUST_BACKTRACE: 1
  # Crates (plus xtask) that build, test and are clippy-clean on Linux today.
  LINUX_CRATES: >-
    -p victory-core -p victory-pe -p victory-formats -p victory-pipeline
    -p victory-game -p victory-loader -p xtask
  # Crates that are clippy-clean for the Windows target today.
  WINDOWS_CLIPPY_CRATES: >-
    -p victory-core -p victory-pe -p victory-formats -p victory-pipeline
    -p victory-game -p victory-loader -p victory-shader
  # Packages that are rustfmt-clean today. The rest (victory-formats,
  # victory-loader, victory-gpu, victory-hle) are not yet; add each one
  # once it is, and switch to `cargo fmt --all --check` when all are.
  RUSTFMT_CRATES: >-
    -p victory-core -p victory-pe -p victory-pipeline -p victory-game
    -p victory-shader -p victory -p xtask
  # Crates whose rustdoc builds with no warnings on Linux today (broken or
  # private intra-doc links, bad code-block attributes, ...). victory-formats
  # and victory-loader are not yet; add each one once it is.
  RUSTDOC_CRATES: >-
    -p victory-core -p victory-pe -p victory-pipeline -p victory-game
    -p victory-shader -p xtask

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Nothing here pushes; keep the token out of .git/config.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # rustup is preinstalled; this installs the toolchain pinned in
      # rust-toolchain.toml (with clippy and rustfmt).
      - name: Install pinned toolchain
        run: rustup toolchain install

      # Save the cache only from main: PR runs restore it but do not write
      # their own entries, which would evict main's from the 10 GB quota.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Asset policy
        run: cargo xtask policy

      # Lints this workflow: expression and context typos, unknown keys, and
      # (via the runner's preinstalled shellcheck) the `run:` scripts, which
      # YAML parsing alone never checks. The release is pinned and its
      # checksum verified, like the actions above. SC2086 (unquoted variable)
      # is ignored because the *_CRATES lists are split into arguments on
      # purpose.
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.7
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfL --retry 3 -O "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          tar xzf "$tarball" actionlint
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/actionlint" -color -ignore 'SC2086:'

      # Fast, needs no build: keep the clean packages clean. load_probe.rs is
      # checked by itself, since the rest of victory-loader is not clean yet.
      - name: rustfmt (clean packages)
        run: |
          cargo fmt --check $RUSTFMT_CRATES
          rustfmt --check --edition 2024 crates/victory-loader/tests/load_probe.rs

      - name: clippy (all targets)
        run: cargo clippy --all-targets --locked $LINUX_CRATES -- -D warnings

      # victory-shader's test module has a helper only the Windows tests use, so
      # its test target is dead code on Linux; lint the library and run tests.
      - name: clippy (victory-shader lib)
        run: cargo clippy --lib --locked -p victory-shader -- -D warnings

      # Doc tests run under `cargo test` below, but rustdoc's own lints (a
      # renamed item leaving a dangling [`link`], a public doc linking to a
      # private item) only fire when the docs are built.
      - name: rustdoc (clean crates)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --locked $RUSTDOC_CRATES

      # The skipped tests parse the test executable itself as a PE image, which
      # is an ELF on Linux. They still run on Windows. Once the workspace's
      # Linux gates land they are cfg(windows) and these --skip flags are no-ops.
      # --no-fail-fast: report failures from every test binary, not the first.
      - name: cargo test
        run: >
          cargo test --locked --no-fail-fast $LINUX_CRATES -p victory-shader
          -- --exact
          --skip image::tests::parses_own_test_binary
          --skip image::tests::rva_to_file_offset_maps_entry_point
          --skip image::tests::rva_to_file_offset_rejects_offsets_past_4_gib
          --skip image::tests::rejects_iat_outside_image
          --skip prepare::tests::patches_own_test_binary
          --skip prepare::tests::keeps_iat_slots_when_import_size_excludes_the_terminator
          --skip prepare::tests::file_name_is_stable_per_build

  # Type-checks the Windows build from Linux: no MSVC, no linking, nothing runs.
  # Catches compile errors in cfg(windows) code (most of victory-gpu,
  # victory-hle and apps/victory, and the Windows-only tests) that the job
  # above never compiles.
  windows-target-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # blake3's build script compiles C/assembly with MSVC tools for this
      # target. Its build script reads this variable to select the pure-Rust
      # implementation; nothing is linked here, so the choice has no effect.
      CARGO_FEATURE_PURE: "1"
      # rustc warnings (unused imports, dead code, ...) fail every step,
      # including in victory-hle and apps/victory, which no clippy step below
      # covers yet. Set for the whole job so all steps share one build.
      # Dependencies are unaffected: cargo caps their lints.
      RUSTFLAGS: -D warnings
    steps:
      # Nothing here pushes; keep the token out of .git/config.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # rust-toolchain.toml already lists the x86_64-pc-windows-msvc target.
      - name: Install pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: windows-target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo check (workspace, all targets)
        run: cargo check --locked --workspace --all-targets --target x86_64-pc-windows-msvc

      # victory-hle (and so apps/victory, which lints it as a dependency) is not
      # clippy-clean for Windows yet; add it here once it is.
      - name: clippy (Windows target, clean crates)
        run: >
          cargo clippy --locked --all-targets --target x86_64-pc-windows-msvc
          $WINDOWS_CLIPPY_CRATES -- -D warnings

      # victory-gpu's library is clean; one of its tests is not yet (a missing
      # SAFETY comment in host.rs). Lint the non-test targets so new warnings in
      # the D3D12 code fail here; switch to --all-targets once the test is fixed.
      - name: clippy (victory-gpu lib, Windows target)
        run: >
          cargo clippy --locked --lib --bins --examples --target x86_64-pc-windows-msvc
          -p victory-gpu -- -D warnings

      # The hle-probe fixture is outside the workspace (load_probe builds it on
      # demand on Windows), so the steps above never compile it. It is
      # Windows-only and needs no linker to check.
      - name: clippy (hle-probe fixture, Windows target)
        run: >
          cargo clippy --locked --all-targets --target x86_64-pc-windows-msvc
          --manifest-path tests/fixtures/hle-probe/Cargo.toml -- -D warnings

      # The fixture is outside the workspace, so `cargo fmt --all` never reaches
      # it. It is rustfmt-clean today; keep it that way. (The workspace itself
      # is not rustfmt-clean on main yet, so it is not checked here.)
      - name: rustfmt (hle-probe fixture)
        run: cargo fmt --check --manifest-path tests/fixtures/hle-probe/Cargo.toml
