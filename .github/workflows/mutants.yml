name: Mutants

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changed-lines:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: Mutants in the lines this PR changes
        shell: pwsh
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin $env:BASE_REF --depth=1
          git diff "origin/$env:BASE_REF...HEAD" | Set-Content "$env:RUNNER_TEMP\pr.diff"
          cargo mutants --in-diff "$env:RUNNER_TEMP\pr.diff" --timeout 300 --jobs 2
