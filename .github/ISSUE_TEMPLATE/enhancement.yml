name: Enhancement
description: Propose a change to project code, tooling or documentation
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Keep the proposal focused on one observable change. Do not attach game
        files, dumps or distribution links.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What cannot be done today, and who is affected?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the smallest change that solves the problem.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What else did you consider, and why is the proposal better?
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: How can a reviewer check the change on a source-built fixture?
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I checked for an existing issue or pull request for this change.
          required: true
        - label: I did not include game files, dumps, distribution links or credentials.
          required: true
